name: CI + Migration Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

  migrate:
    name: Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zakaa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d zakaa_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/zakaa_ci
      DATABASE_SSL_MODE: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Verify no pending migrations
        run: npm run migrate:verify

  rollout-gate:
    name: Rollout Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
      - migrate
    runs-on: ubuntu-latest
    steps:
      - name: Confirm rollout gate
        run: echo "Rollout gate passed: build + migrations succeeded."
